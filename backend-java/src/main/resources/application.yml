server:
  # Render injects PORT. Render Blueprints may also set SERVER_PORT.
  # If neither is set, default to 8080 for local dev.
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: nexushealth-backend

  # Load the project .env (repo root) if present so local `mvn spring-boot:run`
  # works without exporting anything. Optional: missing file is ignored, and
  # real environment variables / Render dashboard values always win.
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"

  datasource:
    # Local dev defaults point at localhost. Override via env vars
    # (MYSQL_URL, or MYSQL_HOST/PORT/DATABASE/USER/PASSWORD + MYSQL_SSL_MODE)
    # on any other machine. Aiven requires TLS -> set MYSQL_SSL_MODE=REQUIRED.
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nexushealth}?sslMode=${MYSQL_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 10000
      maximum-pool-size: 5

  jpa:
    hibernate:
      # update: Hibernate auto-creates/updates tables from entities.
      # Safe for adding new tables/columns. Won't drop or rename anything.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    # Existing Render DB has Hibernate-created tables but NO flyway_schema_history.
    # baseline-on-migrate lets Flyway adopt the current schema as V1 (no destructive
    # validation vs Hibernate) and then apply V2 onwards. V2 drops the dead
    # NOT NULL `preferred_language` column that 500s patient registration
    # (ddl-auto: update can never drop columns).
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    out-of-order: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

nexushealth:
  demo:
    # One-tap demo launchers only RESET the password of the 4 ORIGINAL demo
    # accounts (by email) to the known demo plaintext; they never create any
    # account/record/consent/access-card/appointment. Everything after a demo
    # login is a normal system action persisted by the real /api/auth/login
    # flow. Default OFF so the seeder is inert in normal operation.
    seed:
      enabled: ${DEMO_SEED_ENABLED:false}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:ganeswarikuramdasu@gmail.com}
    password: ${SUPER_ADMIN_PASSWORD:Admin@Nexus2026!}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  gemini:
    api-key: ${GEMINI_API_KEY:}
  email:
    from: ${EMAIL_FROM:NexusHealth Identity <ganeswarikuramdasu@gmail.com>}
    brevo-api-key: ${BREVO_API_KEY:}

logging:
  level:
    com.nexushealth: INFO