# Render Blueprint - NexusHealth Backend (Spring Boot)
# Deploys the Java backend as a web service using the Dockerfile in backend-java/.
# Frontend deploys separately to Vercel (see vercel.json).

services:
  - type: web
    name: nexushealth-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContextPath: .
    healthCheckPath: /api/health
    plan: free
    envVars:
      # Server
      - key: SERVER_PORT
        value: 8080
      # Database
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      # SMTP
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
